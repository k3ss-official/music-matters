name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: |
          pip install --upgrade pip
          pip install fastapi "uvicorn[standard]" pydantic pydantic-settings \
            httpx pytest python-multipart soundfile numpy psutil yt-dlp
      - name: Run tests
        env:
          PYTHONPATH: backend
          MUSIC_LIBRARY: ${{ runner.temp }}/mm-lib
          HF_HOME: ${{ runner.temp }}/hf
        run: pytest backend/tests -q --ignore=backend/tests/test_e2e.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
