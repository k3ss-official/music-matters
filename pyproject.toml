[build-system]
requires = ["setuptools>=67", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "music-matters"
version = "2.0.0"
description = "Local-first DJ/producer automation stack."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "k3ss", email = "dev@k3ss.io"}]
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "python-dotenv>=1.0",
  "librosa>=0.10",
  "numpy>=1.26",
  "scipy>=1.11",
  "soundfile>=0.12",
  "pydub>=0.25",
  "yt-dlp>=2024.10.7",
  "httpx>=0.27",
  "aiofiles>=23.2",
  "demucs>=4.0.0",
  "torch>=2.2",
  "torchaudio>=2.2",
  "pyacoustid>=1.3",
  "musicbrainzngs>=0.7.1",
  "python-multipart>=0.0.6",
  "pyyaml>=6.0",
  "psutil>=5.9",
  "tqdm>=4.66"
]

[project.optional-dependencies]
recognition = [
  "shazamio>=0.6.0",
]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.23",
  "httpx>=0.27",
  "ruff>=0.6",
  "mypy>=1.9"
]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
markers = [
  "e2e: requires a live Music Matters server",
]
